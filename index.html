<!-- Owns the complete Wooddrop gathering/building demo: UI, simulation, input, and canvas rendering. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wooddrop</title>
<style>
  :root{
    --ink:#292119; --paper:#f1dfb7; --red:#a94634; --gold:#d29a39;
    --shadow:3px 3px 0 #17120d99;
    --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{display:grid;place-items:center;background:#0b0d13;color:var(--ink);font:12px/1.35 var(--mono);text-transform:lowercase}
  #game{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16 / 9;container:game-frame / inline-size}
  #stage{position:absolute;inset:0}
  /* Frame-local stack: HUD 3, dock 4, prompt/pause 5, upgrade 6, debug 7, toast 8, game-over 10. */
  #phaseHud{position:absolute;z-index:3;right:10px;top:10px;width:245px;padding:8px 9px;background:#292119ed;color:var(--paper);border:2px solid var(--gold);box-shadow:var(--shadow);pointer-events:none}
  #phaseHud.night{background:#17213aed;border-color:#c65b4d;color:#dce9ff}
  #phaseHeader{display:flex;justify-content:space-between;font-size:13px}
  #phaseProgress{height:5px;margin:6px 0;background:#17120d;border:1px solid #0008}
  #phaseProgressFill{display:block;height:100%;background:var(--gold)}
  #phaseHud.night #phaseProgressFill{background:#c65b4d}
  #forecastLabel{font-size:9px;opacity:.72;margin-bottom:3px}
  #forecastSides{font-weight:bold;margin-bottom:4px}
  #forecastRemaining{font-size:9px;color:#d98b75;margin-bottom:3px}
  #recipeSummary{display:flex;flex-wrap:wrap;gap:2px 9px;list-style:none;font-size:10px}
  #buildDock{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);width:min(900px,calc(100% - 20px));pointer-events:none}
  #buildCards{display:none;margin-bottom:5px;padding:5px;background:#f1dfb7f2;border:2px solid var(--ink);box-shadow:var(--shadow);pointer-events:auto}
  #buildCards.open{display:block}
  .build-category{display:none;gap:5px;overflow-x:auto;padding-bottom:2px}
  .build-category.open{display:flex}
  #buildTabs{display:grid;grid-template-columns:repeat(4,1fr);width:min(520px,100%);margin:auto;padding:3px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);pointer-events:auto}
  button{width:100%;font:inherit;text-transform:lowercase;text-align:left;color:var(--ink);cursor:pointer;background:#e6d09f;border:2px solid #b99f6c;padding:7px;margin:2px 0}
  button:hover{border-color:var(--ink);background:#f7e8c5}
  button.on,.dock-tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button:disabled{cursor:not-allowed;opacity:.42;filter:saturate(.4)}
  button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .dock-tab{text-align:center;margin:0;padding:6px}
  .build-category .build{position:relative;flex:0 0 150px;min-height:68px;margin:0;padding:6px}
  .build-category .build:hover{transform:translateY(-1px)}
  .build-category .build.on{box-shadow:inset 0 0 0 1px var(--gold)}
  .cost,.purpose{display:block;font-size:9px;margin-top:2px}
  .cost{color:#765f42}.purpose{opacity:.72}
  kbd{background:var(--ink);color:var(--paper);padding:1px 4px;font:inherit}
  canvas{width:100%;height:100%;display:block;background:#617738;image-rendering:pixelated;cursor:default}
  canvas.building{cursor:crosshair}
  #toast{position:absolute;z-index:8;left:50%;bottom:calc(var(--build-dock-clearance,42px) + 16px);transform:translateX(-50%);background:#292119e8;color:var(--paper);border:2px solid #17120d;padding:5px 9px;opacity:0;transition:opacity .15s,bottom .15s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}#game.modal-open #toast{opacity:0}
  #prompt{position:absolute;z-index:5;left:50%;top:9px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);padding:5px 9px;opacity:0;pointer-events:none}
  #prompt.on{opacity:1}
  #prompt kbd{margin-right:5px}
  #upgradePanel,#debugPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;padding:9px;background:#242919;color:var(--paper);border:2px solid #d8c58f;box-shadow:5px 5px 0 #17120daa}
  #upgradePanel{z-index:6}#debugPanel{z-index:7;border-color:#d77a62}
  #upgradePanel.off,#debugPanel.off{display:none}
  #upgradePanel h3,#debugPanel h3{text-align:center;font-size:14px;border-bottom:1px solid #8f9760;padding-bottom:5px;margin-bottom:7px}
  #debugPanel h3::before{content:"debug · ";color:#ed8a70}
  #upgradeOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  #upgradeOptions button{height:58px;text-align:center;padding:4px;background:#354027;color:var(--paper);border-color:#69754b;font-size:9px}
  #upgradeOptions button.on{border-color:#78d7d4;background:#425339}
  #upgradeOptions button.owned{opacity:.4}
  #upgradeOptions b{display:block;font-size:17px;line-height:1.1}
  #upgradeOptions .variant-card{height:58px;text-align:center;padding:4px}
  #upgradeOptions .variant-card b{font-size:17px}
  #upgradeDetail .detail-meta{color:#9ed8d3;font-size:9px;margin-bottom:3px}
  #upgradeDetail{min-height:64px;margin-top:7px;padding:6px;border-top:1px solid #8f9760;border-bottom:1px solid #8f9760}
  #upgradeDetail b{display:block;margin-bottom:3px}
  #upgradeActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
  #upgradeActions button{text-align:center;margin:0}
  #upgradeAccept{background:#557a35;color:#fff}#upgradeDecline{background:#8e2924;color:#fff}
  #debugButton{margin:0;padding:6px;text-align:center;background:#4d2f2b;color:#f1dfb7;border-color:#a75a4d}#debugButton.on{background:#8e3e34}
  #debugOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  #debugOptions button{height:68px;text-align:center;padding:4px;background:#354027;color:var(--paper);border-color:#69754b;font-size:9px}
  #debugOptions b{display:block;font-size:17px;line-height:1.1}#debugOptions span{display:block;margin-top:2px}
  #debugOptions button.legitimate{border-color:#d4b95f}#debugOptions button.forced-on{border-color:#78d7d4;background:#425339}#debugOptions button.forced-off{border-color:#d56b5b;background:#51312c}#debugOptions button.unowned{opacity:.72}
  #debugDetail{min-height:42px;margin-top:7px;padding:6px;border-top:1px solid #8f9760;border-bottom:1px solid #8f9760}
  #debugActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}#debugActions button{text-align:center;margin:0}#debugClear{background:#725b32;color:#fff}#debugClose{background:#8e2924;color:#fff}
  #gameOver{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#17120dcc}
  #gameOver.off{display:none}
  #gameOver .endcard{width:280px;padding:18px;text-align:center;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 #0008}
  #gameOver h2{font-size:23px;border:0;margin:0 0 8px;color:var(--red)}
  #pauseBadge{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:5;padding:9px 18px;background:#292119e8;color:var(--paper);border:2px solid var(--paper);font-size:17px;pointer-events:none}
  #pauseBadge.off{display:none}
  #gameOver p{margin-bottom:12px}
  #restart{background:var(--ink);color:var(--paper);text-align:center;padding:9px}
  @container game-frame (max-width:799px){
    #phaseHud{right:6px;top:6px;width:50%;padding:5px 6px;font-size:10px}
    #phaseHeader{font-size:11px}#phaseProgress{margin:4px 0}
    #forecastLabel,#forecastRemaining,#recipeSummary{font-size:9px}#recipeSummary{gap:1px 6px}
    #buildDock{bottom:6px;width:calc(100% - 12px)}#buildCards{padding:3px;margin-bottom:3px}
    .build-category{gap:3px}.build-category .build{flex-basis:126px;min-height:58px;padding:5px;font-size:10px}
    .cost,.purpose{font-size:9px}#buildTabs{width:min(440px,100%);padding:2px}.dock-tab{padding:4px;font-size:10px}
    #debugOptions{grid-template-columns:repeat(2,1fr)}#upgradePanel,#debugPanel{max-height:calc(100% - 12px)}
  }
</style>
</head>
<body>
<div id="game">
  <section id="buildDock" aria-label="build dock">
    <div id="buildCards">
      <section class="build-category" data-category="economy">
        <button class="build" data-kind="lumber" title="staff to gather nearby wood"><b>lumber camp</b><span class="cost">8w · 2s</span><span class="purpose">gathers wood</span></button>
        <button class="build" data-kind="quarry" title="staff to gather nearby stone"><b>quarry</b><span class="cost">4w · 8s</span><span class="purpose">gathers stone</span></button>
        <button class="build" data-kind="stockpile" title="stores loose resources for haulers"><b>stockpile</b><span class="cost">2w · 0s</span><span class="purpose">local storage</span></button>
        <button class="build" data-kind="house" title="adds two worker slots"><b>house</b><span class="cost" id="houseCost">8w · 6s</span><span class="purpose">worker capacity</span></button>
        <button class="build" data-kind="obelisk" title="accepts permanent building upgrades"><b>obelisk</b><span class="cost">5w · 12s</span><span class="purpose">upgrades</span></button>
      </section>
      <section class="build-category" data-category="defense">
        <button class="build" data-kind="tower" title="fires nearby and accepts one permanent variant"><b>basic tower</b><span class="cost">6w · 10s</span><span class="purpose">upgradeable chassis</span></button>
      </section>
      <section class="build-category" data-category="deployables">
        <button class="build" data-kind="blast" title="click its hover control to detonate"><b>blast charge</b><span class="cost">free · unlimited</span><span class="purpose">manual blast</span></button>
        <button class="build" data-kind="spikes" title="repeatedly damages enemies crossing it"><b>spike trap</b><span class="cost" id="spikeStack">free · 5 left</span><span class="purpose">contact damage</span></button>
        <button class="build" data-kind="landmine" title="single-use area explosion"><b>land mine</b><span class="cost" id="landmineStack">free · 3 left</span><span class="purpose">area blast</span></button>
        <button class="build" data-kind="tar" title="slows enemies crossing it"><b>tar</b><span class="cost" id="tarStack">free · 3 left</span><span class="purpose">slows enemies</span></button>
      </section>
    </div>
    <nav id="buildTabs" aria-label="build categories">
      <button class="dock-tab" data-category="economy">economy</button>
      <button class="dock-tab" data-category="defense">defense</button>
      <button class="dock-tab" data-category="deployables">deployables</button>
      <button id="debugButton" type="button" hidden>debug</button>
    </nav>
  </section>
  <main id="stage">
    <canvas id="canvas" width="960" height="540"></canvas>
    <section id="phaseHud">
      <header id="phaseHeader"><b id="phaseName">day 1</b><b id="phaseTime">1:15</b></header>
      <div id="phaseProgress"><i id="phaseProgressFill"></i></div>
      <div id="forecastLabel">next attack</div>
      <div id="forecastSides"></div>
      <div id="forecastRemaining"></div>
      <ul id="recipeSummary"></ul>
    </section>
    <div id="prompt"><kbd>release right</kbd><span></span></div>
    <div id="toast"></div>
    <div id="pauseBadge" class="off">paused · esc to resume</div>
    <section id="upgradePanel" class="off">
      <h3 id="upgradeTitle">upgrades</h3>
      <div id="upgradeOptions"></div>
      <div id="upgradeDetail">select an upgrade</div>
      <div id="upgradeActions"><button id="upgradeAccept">accept</button><button id="upgradeDecline">decline</button></div>
    </section>
    <section id="debugPanel" class="off" aria-label="debug global upgrades" hidden>
      <h3>global upgrades</h3>
      <div id="debugOptions"></div>
      <div id="debugDetail">click an upgrade to force its effective state.</div>
      <div id="debugActions"><button id="debugClear">clear overrides</button><button id="debugClose">close</button></div>
    </section>
    <section id="gameOver" class="off"><div class="endcard"><h2>the base has fallen</h2><p>the kingdom is lost. begin again?</p><button id="restart">restart</button></div></section>
  </main>
</div>
<script>
"use strict";
// Wooddrop's world is one explicit state object. Input mutates it; update advances it; draw only reads it.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const VIEW_W=960,VIEW_H=540;                 // Fixed 16:9 logical frame; CSS scales both axes together.

  turret:{icon:"⌖",name:"turret",family:"Starter",description:"cheapest choice; compact gun with a modest single-target improvement.",cost:{wood:2,stone:2},attackMode:"single",range:165,damage:2,cooldown:1.2,maxHp:12,manual:false,movable:false,accent:"#d8b06a",sound:290},

  {id:"raiderRush",spawns:[["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"],["raider","primary"]]},

const DAY_DURATION=75,NIGHT_DURATION=45;

const KING={range:95,damage:2,rate:.85};
const FOG_TS=32,FOG_W=W/FOG_TS,FOG_H=H/FOG_TS;
const trees = [];
const rocks = [];
const diamonds = [];
const resourceDrops = [];
const buildings = [];
// ── Worker corpse ownership flow ──
// Written by: killWorker() creates one immutable visual snapshot per final death.
// Read by:    draw() only; corpses never enter interaction, placement, targeting, or update systems.
// Format:     death position plus compact pose/clothing values; never a mutable Worker object.
// Lifetime:   page load until run restart; no decay or removal.
const workerCorpses = [];
const particles = [];

  baseHp:100,baseMax:100,gameOver:false,paused:false,dayEnemyTimer:DAY_ENEMY_SPAWN.min,coinTimer:6,basePulse:0,baseSpawnTimer:WORKER_SPAWN_TIME,buildMode:null,buildDockCategory:null,capacity:5,toastTimer:0,collectCooldown:0,collecting:false,

const rand = (a,b) => a + Math.random()*(b-a);
const distance = (a,b,c,d) => Math.hypot(a-c,b-d);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const RESOURCE_KINDS=["wood","stone","dust","coin","diamond"];
const carriedTotal=()=>RESOURCE_KINDS.reduce((total,kind)=>total+state.carried[kind],0);
// ── Global upgrade ownership flow ──
// Legitimate writes: completed obelisks set building.upgrades[id] in dropToUpgrade().
// Debug writes:      helpers below mutate only state.debug.upgradeOverrides; missing means no override.
// Gameplay reads:    globalUpgradeEnabled() resolves explicit true/false first, then legitimate ownership.
function legitimateGlobalUpgradeOwned(id){return buildings.some(building=>building.complete&&building.type==="obelisk"&&building.upgrades[id]);}
function globalUpgradeHasOverride(id){return Object.hasOwn(state.debug.upgradeOverrides,id);}
function globalUpgradeEnabled(id){return globalUpgradeHasOverride(id)?state.debug.upgradeOverrides[id]:legitimateGlobalUpgradeOwned(id);}
function setGlobalUpgradeDebugOverride(id,enabled){if(!UPGRADES.some(upgrade=>upgrade.id===id))return;state.debug.upgradeOverrides[id]=!!enabled;if(id==="autoClick"&&!globalUpgradeEnabled(id))stopPrimaryClick();if(debugPanelOpen())renderDebugPanel();}
function clearGlobalUpgradeDebugOverride(id){delete state.debug.upgradeOverrides[id];if(id==="autoClick"&&!globalUpgradeEnabled(id))stopPrimaryClick();if(debugPanelOpen())renderDebugPanel();}
function clearGlobalUpgradeDebugOverrides(){state.debug.upgradeOverrides={};if(!globalUpgradeEnabled("autoClick"))stopPrimaryClick();if(debugPanelOpen())renderDebugPanel();}
function oppositeMapSide(side){return side===MAP_SIDE.NORTH?MAP_SIDE.SOUTH:side===MAP_SIDE.SOUTH?MAP_SIDE.NORTH:side===MAP_SIDE.EAST?MAP_SIDE.WEST:MAP_SIDE.EAST;}
function chooseUpcomingNight(){
  const wave=state.nightWave,choices=MAP_SIDES.filter(side=>!wave.lastSides.includes(side));
  wave.upcomingSide=choices[(Math.random()*choices.length)|0];
  wave.upcomingRecipe=NIGHT_WAVE_RECIPES[(Math.random()*NIGHT_WAVE_RECIPES.length)|0];
}
chooseUpcomingNight();

// Full land map: dense resource patches surround one initial clearing, while fog controls expansion.
function seedWorld(){
  const occupied=[];
  const place=(count,minGap,make,accept=()=>true)=>{
    let tries=0;
    while(count>0&&tries++<6000){
      const x=rand(30,W-30),y=rand(35,H-25);
      if(distance(x,y,BASE.x,BASE.y)<110||!accept(x,y))continue;
      if(occupied.some(p=>distance(x,y,p.x,p.y)<minGap))continue;
      occupied.push({x,y});make(x,y);count--;
    }
  };
  // Fewer, richer nodes: each has 10× the old durability and therefore yields 10× as many drops.
  place(80,45,(x,y)=>trees.push({x,y,hp:100,max:100,stump:0,shake:0,variant:trees.length%3}));
  place(24,49,(x,y)=>rocks.push({x,y,hp:70,max:70,depleted:0,shake:0}));
  place(5,110,(x,y)=>diamonds.push({x,y,hp:25,max:25,depleted:0,shake:0}),
    (x,y)=>distance(x,y,BASE.x,BASE.y)>600);
  state.fog.fill(1);revealFog(BASE.x,BASE.y,9);
}
function fogIndex(x,y){return y*FOG_W+x;}
function isFogged(x,y){return !!state.fog[fogIndex(clamp(Math.floor(x/FOG_TS),0,FOG_W-1),clamp(Math.floor(y/FOG_TS),0,FOG_H-1))];}
function revealFog(x,y,radius){
  const cx=Math.floor(x/FOG_TS),cy=Math.floor(y/FOG_TS),r=Math.ceil(radius);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const tx=cx+dx,ty=cy+dy;if(tx<0||ty<0||tx>=FOG_W||ty>=FOG_H||Math.hypot(dx,dy)>radius)continue;
    state.fog[fogIndex(tx,ty)]=0;
  }
}
seedWorld();

// ── Data flow ──
// Written by: pointer/keyboard handlers below.
// Read by: update() for collection/drop delivery and draw() for hover feedback.
// Format: state.mouse is world-space pixels after fixed-frame scaling and inverse camera transform.
// Lifetime: page load until refresh.
function pointerPosition(event){
  const r=canvas.getBoundingClientRect(),camera=state.camera;
  const sx=(event.clientX-r.left)*VIEW_W/r.width,sy=(event.clientY-r.top)*VIEW_H/r.height;
  // Screen pixels become world pixels through the inverse camera transform used by draw().
  state.mouse.x=camera.x+(sx-VIEW_W/2)/camera.zoom;
  state.mouse.y=camera.y+(sy-VIEW_H/2)/camera.zoom;
  state.mouse.inside=true;
}
function clampCamera(){
  const camera=state.camera,halfW=VIEW_W/(2*camera.zoom),halfH=VIEW_H/(2*camera.zoom);
  camera.x=halfW>=W/2?W/2:clamp(camera.x,halfW,W-halfW);
  camera.y=halfH>=H/2?H/2:clamp(camera.y,halfH,H-halfH);
}
canvas.addEventListener("wheel",event=>{
  event.preventDefault();
  const r=canvas.getBoundingClientRect(),camera=state.camera;
  const sx=(event.clientX-r.left)*VIEW_W/r.width,sy=(event.clientY-r.top)*VIEW_H/r.height;
  const worldX=camera.x+(sx-VIEW_W/2)/camera.zoom,worldY=camera.y+(sy-VIEW_H/2)/camera.zoom;
  const next=clamp(camera.zoom*Math.exp(-event.deltaY*.0015),.2,5);
  camera.x=worldX-(sx-VIEW_W/2)/next;camera.y=worldY-(sy-VIEW_H/2)/next;camera.zoom=next;
  clampCamera();pointerPosition(event);
},{passive:false});
canvas.addEventListener("pointermove",event=>{
  const camera=state.camera;
  if(camera.panning){
    const r=canvas.getBoundingClientRect();
    camera.x-=(event.clientX-camera.lastX)*VIEW_W/r.width/camera.zoom;
    camera.y-=(event.clientY-camera.lastY)*VIEW_H/r.height/camera.zoom;
    camera.lastX=event.clientX;camera.lastY=event.clientY;clampCamera();
  }
  pointerPosition(event);
});
canvas.addEventListener("pointerleave",()=>{state.mouse.inside=false;});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
canvas.addEventListener("auxclick",event=>event.preventDefault());
canvas.addEventListener("pointerdown",event=>{
  pointerPosition(event);
  if(event.button===1){event.preventDefault();state.camera.panning=true;state.camera.lastX=event.clientX;state.camera.lastY=event.clientY;canvas.setPointerCapture(event.pointerId);return;}
  if(state.gameOver||state.paused||modalOpen())return;
  if(event.button===0){leftClick();if(globalUpgradeEnabled("autoClick")&&!modalOpen())startPrimaryClick();}
  if(event.button===2){if(cancelBuildMode())return;if(pickUpMovableAt(state.mouse.x,state.mouse.y))return;state.collecting=true;collectDrop();state.collectCooldown=.08;}
});
// Window-level release prevents collection or camera drag getting stuck outside the canvas.
window.addEventListener("pointerup",event=>{if(event.button===0)stopPrimaryClick();if(event.button===2)releaseRightMouse();if(event.button===1)state.camera.panning=false;});
window.addEventListener("pointercancel",()=>{stopPrimaryClick();state.collecting=false;state.camera.panning=false;cancelHeldObject();});
window.addEventListener("blur",()=>{stopPrimaryClick();state.collecting=false;state.camera.panning=false;state.keys.clear();cancelHeldObject();});
window.addEventListener("keydown",event=>{
  if(event.code==="Escape"){event.preventDefault();if(!event.repeat){if(closeDebugPanel())return;if(closeUpgradeMenu())return;if(cancelBuildMode())return;togglePause();}return;}
  if(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowLeft","ArrowDown","ArrowRight"].includes(event.code)){event.preventDefault();state.keys.add(event.code);}
});
window.addEventListener("keyup",event=>state.keys.delete(event.code));

function startPrimaryClick(){state.primaryClick.held=true;}
// Release/cancel owns only held state; the shared work cooldown survives every stop/start boundary.
function stopPrimaryClick(){state.primaryClick.held=false;}
function stopGameplayInput(cancelPlacement=false){
  stopPrimaryClick();state.collecting=false;state.camera.panning=false;state.keys.clear();
  if(cancelPlacement){state.buildMode=null;setBuildDockCategory(null);syncBuildHud();}
}
function togglePause(){
  if(state.gameOver)return;
  state.paused=!state.paused;stopGameplayInput();
  if(state.paused){closeDebugPanel();closeUpgradeMenu();}
  document.getElementById("pauseBadge").classList.toggle("off",!state.paused);sound(state.paused?180:360,.06);
}
function cancelBuildMode(){
  if(!state.buildMode)return false;
  state.buildMode=null;syncBuildHud();toast("building placement cancelled");return true;
}
function spawnEnemy(side=null,enemyType=null){
  const attackSide=side||MAP_SIDES[(Math.random()*MAP_SIDES.length)|0],type=enemyType||ENEMY_POOL[(Math.random()*ENEMY_POOL.length)|0],def=ENEMY_TYPES[type];
  let x,y;
  if(attackSide===MAP_SIDE.WEST){x=8;y=rand(20,H-20);}else if(attackSide===MAP_SIDE.EAST){x=W-8;y=rand(20,H-20);}
  else if(attackSide===MAP_SIDE.NORTH){x=rand(20,W-20);y=8;}else{x=rand(20,W-20);y=H-8;}
  state.enemies.push({type,spawnSide:attackSide,x,y,hp:def.hp,max:def.hp,attackCooldown:0,healCooldown:rand(.5,2),wob:rand(0,6),flash:0,shotFlash:0,healFlash:0,status:{burn:null,slow:null},retaliationTower:null});
}
function enemyAt(x,y){
  let target=null,best=Infinity;
  for(const enemy of state.enemies){
    if(isFogged(enemy.x,enemy.y))continue;
    const d=distance(x,y,enemy.x,enemy.y),hitRadius=24*ENEMY_TYPES[enemy.type].size;
    if(d<hitRadius&&d<best){best=d;target=enemy;}
  }
  return target;
}
function killEnemy(enemy,announce=true){
  const at=state.enemies.indexOf(enemy);if(at<0)return;
  // Death owns status teardown so every damage path releases tower/source references immediately.
  enemy.status={burn:null,slow:null};enemy.retaliationTower=null;state.enemies.splice(at,1);
  const droppedDust=Math.random()<.25;
  if(droppedDust)spawnResource("dust",enemy.x+rand(-7,7),enemy.y);
  burst(enemy.x,enemy.y,"#4b3b50",12);if(announce||droppedDust)toast(droppedDust?"enemy defeated — dust dropped":"enemy defeated");sound(150,.12);
}
function hitEnemy(enemy,quiet=false){
  enemy.hp--;enemy.flash=.16;
  burst(enemy.x,enemy.y,"#d25b49",5);if(!quiet)sound(610,.045);
  if(enemy.hp<=0)killEnemy(enemy);
}
function blastButtonHit(building,x,y){return x>=building.x-30&&x<=building.x+30&&y>=building.y-34&&y<=building.y+34;}
function manualTowerButtonHit(building,x,y){return x>=building.x-30&&x<=building.x+30&&y>=building.y-42&&y<=building.y+34;}
function towerVariant(building){return TOWER_VARIANTS[building.tower?.variant||"basic"];}
function workerNodeAt(x,y){
  let found=null,best=38;
  for(const [nodes,kind] of [[trees,"wood"],[rocks,"stone"],[diamonds,"diamond"]])for(const node of nodes){const d=distance(x,y,node.x,node.y);if(resourceIsActive(node,kind)&&!isFogged(node.x,node.y)&&d<best){found={node,kind};best=d;}}
  return found;
}
function pickUpMovableAt(x,y){
  let worker=null,best=24;
  for(const candidate of state.workers){const d=distance(x,y,candidate.x,candidate.y);if(d<best){worker=candidate;best=d;}}
  if(worker){
    clearWorkerTask(worker);state.workers.splice(state.workers.indexOf(worker),1);
    state.heldObject={kind:"worker",object:worker,originX:worker.x,originY:worker.y};state.collecting=false;toast("worker lifted — release to assign");return true;
  }
  const building=buildings.find(item=>item.complete&&item.type==="tower"&&towerVariant(item).movable&&manualTowerButtonHit(item,x,y));
  if(!building)return false;
  state.heldObject={kind:"building",object:building,originX:building.x,originY:building.y};buildings.splice(buildings.indexOf(building),1);state.collecting=false;
  toast(towerVariant(building).name+" picked up — release right to place");return true;
}
function heldWorker(){return state.heldObject?.kind==="worker"?state.heldObject.object:null;}
function heldBuilding(){return state.heldObject?.kind==="building"?state.heldObject.object:null;}
function cancelHeldObject(){
  if(!state.heldObject)return;
  const held=state.heldObject,object=held.object;object.x=held.originX;object.y=held.originY;
  if(held.kind==="worker")state.workers.push(object);else buildings.push(object);state.heldObject=null;
}
// Assignment priority is resolved once so drop behavior and held-worker preview cannot drift.
function workerAssignmentAt(worker,x,y){
  if(x<20||y<20||x>W-20||y>H-20||isFogged(x,y))return null;
  const near=predicate=>buildings.find(item=>predicate(item)&&distance(x,y,item.x,item.y)<42);
  const blueprint=near(item=>!item.complete),node=workerNodeAt(x,y),staff=near(item=>item.complete&&(item.type==="lumber"||item.type==="quarry")),stockpile=near(item=>item.complete&&item.type==="stockpile"),house=near(item=>item.complete&&item.type==="house");
  if(blueprint)return {job:"build",target:blueprint,postX:blueprint.x,postY:blueprint.y+20,zoneX:blueprint.x,zoneY:blueprint.y,zoneRadius:WORKER_LEASH};
  if(node)return {job:"harvest",target:node,postX:x,postY:y,zoneX:x,zoneY:y,zoneRadius:WORKER_LEASH};
  if(staff)return {job:"staff",target:staff,postX:staff.x,postY:staff.y+16,zoneX:staff.x,zoneY:staff.y,zoneRadius:BUILDING_TYPES[staff.type].serviceRadius};
  if(stockpile)return {job:"haul",target:stockpile,postX:stockpile.x,postY:stockpile.y+18,zoneX:stockpile.x,zoneY:stockpile.y,zoneRadius:storageServiceRadius(stockpile)};
  if(house)return {job:"guard",target:null,postX:house.x,postY:house.y+23,zoneX:house.x,zoneY:house.y+23,zoneRadius:WORKER_LEASH};
  if(distance(x,y,BASE.x,BASE.y)<BASE.r+18)return {job:"haul",target:BASE,postX:BASE.x,postY:BASE.y+25,zoneX:BASE.x,zoneY:BASE.y,zoneRadius:BASE_ZONE};
  return {job:"guard",target:null,postX:x,postY:y,zoneX:x,zoneY:y,zoneRadius:WORKER_LEASH};
}
function assignWorker(worker,x,y){
  const assignment=workerAssignmentAt(worker,x,y);if(!assignment)return null;
  clearWorkerTask(worker);worker.x=x;worker.y=y;worker.postX=assignment.postX;worker.postY=assignment.postY;worker.job=assignment.job;worker.jobTarget=assignment.target;worker.retaliationTarget=null;worker.returnAfterCombat=false;worker.returning=false;worker.starved=false;
  if(worker.job!=="haul")for(const kind of RESOURCE_KINDS){while(worker.carried[kind]>0){worker.carried[kind]--;spawnResource(kind,x+rand(-8,8),y+rand(-5,5));}}
  return worker.job;
}
function dropHeldObject(){
  const held=state.heldObject;if(!held)return false;
  if(held.kind==="worker"){
    const worker=held.object,result=state.mouse.inside&&assignWorker(worker,state.mouse.x,state.mouse.y);
    if(result){state.workers.push(worker);const assignment=worker.job==="haul"?"haul to "+(worker.jobTarget===BASE?"base":"stockpile"):result;toast("worker assigned: "+assignment);}
    else{worker.x=held.originX;worker.y=held.originY;state.workers.push(worker);toast("invalid ground — worker returned");}
    state.heldObject=null;sound(260,.06);return true;
  }
  const building=held.object;
  if(state.mouse.inside&&canPlace(state.mouse.x,state.mouse.y)){building.x=state.mouse.x;building.y=state.mouse.y;toast(towerVariant(building).name+" placed");}
  else{building.x=held.originX;building.y=held.originY;toast("invalid ground — tower returned");}
  buildings.push(building);state.heldObject=null;sound(260,.06);return true;
}
function activateManualTower(building){
  const tower=building.tower,variant=towerVariant(building);if(!variant.manual)return;
  if(tower.cooldown>0){toast(variant.name+" recharging: "+tower.cooldown.toFixed(1)+"s");return;}
  tower.cooldown=variant.cooldown;tower.flash=.35;
  for(const enemy of [...state.enemies]){
    if(isFogged(enemy.x,enemy.y)||distance(building.x,building.y,enemy.x,enemy.y)>variant.effectRadius)continue;
    damageEnemy(enemy,variant.damage,variant.accent,7,building);
  }
  burst(building.x,building.y,variant.accent,24);toast("shock pulse fired");sound(variant.sound,.28);
}
function detonateBlast(building){
  for(const enemy of [...state.enemies]){
    const d=distance(building.x,building.y,enemy.x,enemy.y),radius=BUILDING_TYPES.blast.effectRadius;if(d>radius)continue;
    enemy.hp-=d<radius*.5?5:3;enemy.flash=.2;
    if(enemy.hp<=0)killEnemy(enemy,false);
  }
  for(let i=0;i<42;i++)particles.push({x:building.x,y:building.y,vx:rand(-180,180),vy:rand(-190,40),life:rand(.35,.9),col:i%2?"#e39a3f":"#b84b38"});
  buildings.splice(buildings.indexOf(building),1);toast("blast charge detonated");sound(70,.3);
}
function createBuilding(type,x,y){
  const def=BUILDING_TYPES[type],cost=type==="house"?nextHouseCost():{...def.cost};
  return {type,x,y,cost,delivered:{wood:0,stone:0},storage:{wood:0,stone:0,dust:0,coin:0,diamond:0},upgrades:{},activeUpgrade:null,tower:null,hazard:["spikes","landmine","tar"].includes(type)?{cooldown:0,flash:0}:null,complete:!!def.instant,pulse:1};
}

function playerResourceAt(x,y){
  let target=null,kind=null,best=34;
  for(const tree of trees){if(tree.stump>0||isFogged(tree.x,tree.y))continue;const d=distance(x,y,tree.x,tree.y-10);if(d<best){best=d;target=tree;kind="wood";}}
  for(const rock of rocks){if(rock.depleted>0||isFogged(rock.x,rock.y))continue;const d=distance(x,y,rock.x,rock.y);if(d<best){best=d;target=rock;kind="stone";}}
  for(const diamond of diamonds){if(diamond.depleted>0||isFogged(diamond.x,diamond.y))continue;const d=distance(x,y,diamond.x,diamond.y);if(d<best){best=d;target=diamond;kind="diamond";}}
  return target?{target,kind}:null;
}
// Manual presses and steady-hand hold enter this single gate; only successful player work consumes it.
function tryPlayerWorkAction(){
  const m=state.mouse,primary=state.primaryClick;if(primary.actionCooldown>0||!m.inside||isFogged(m.x,m.y))return false;
  const quiet=primary.audioCooldown>0,enemy=enemyAt(m.x,m.y),resource=enemy?null:playerResourceAt(m.x,m.y);
  if(!enemy&&!resource)return false;
  primary.actionCooldown=1/PLAYER_CLICK_CPS;
  if(enemy)hitEnemy(enemy,quiet);else hitResource(resource.target,resource.kind,false,quiet);
  if(!quiet)primary.audioCooldown=.25;return true;
}
// Simulation time advances one cooldown and, while held, retries current cursor work without buffering missed actions.
function updatePrimaryClick(dt){
  const primary=state.primaryClick;primary.actionCooldown=Math.max(0,primary.actionCooldown-dt);primary.audioCooldown=Math.max(0,primary.audioCooldown-dt);
  if(!primary.held)return;if(modalOpen()||!globalUpgradeEnabled("autoClick")){stopPrimaryClick();return;}
  if(state.mouse.inside)tryPlayerWorkAction();
}
function leftClick(){
  if(state.gameOver||state.paused)return;
  const m=state.mouse;
  if(isFogged(m.x,m.y)){
    revealFog(m.x,m.y,1.65);sound(230,.07);
    toast(state.buildMode?"fog cleared — click again to place":"fog cleared");
    return;
  }
  const enemy=enemyAt(m.x,m.y);
  if(enemy){tryPlayerWorkAction();return;}
  if(state.buildMode){
    if(canPlace(m.x,m.y)){
      const type=state.buildMode,def=BUILDING_TYPES[type];
      buildings.push(createBuilding(type,m.x,m.y));
      if(def.stack){state.buildStacks[type]--;state.buildMode=state.buildStacks[type]>0?type:null;}else state.buildMode=null;
      setBuildDockCategory(null);syncBuildHud();
      sound(240,.06);
      toast(def.stack?def.name+" placed — "+state.buildStacks[type]+" stacks remain":def.instant?def.name+" placed — hover it to detonate":"blueprint placed — carry its resources to it");
    }else toast("needs clear ground away from the base");
    return;
  }
  const blast=buildings.find(building=>building.complete&&building.type==="blast"&&blastButtonHit(building,m.x,m.y));
  if(blast){detonateBlast(blast);return;}
  const manualTower=buildings.find(building=>building.complete&&building.type==="tower"&&towerVariant(building).manual&&manualTowerButtonHit(building,m.x,m.y));
  if(manualTower){activateManualTower(manualTower);return;}
  const obelisk=buildings.find(building=>building.complete&&building.type==="obelisk"&&upgradeButtonHit(building,m.x,m.y));
  if(obelisk){openUpgradeMenu(obelisk,"obelisk");return;}
  const tower=buildings.find(building=>building.complete&&building.type==="tower"&&building.tower.variant==="basic"&&!building.activeUpgrade&&upgradeButtonHit(building,m.x,m.y));
  if(tower){openUpgradeMenu(tower,"tower");return;}
  const pile=buildings.find(building=>building.complete&&building.type==="stockpile"&&distance(m.x,m.y,building.x,building.y)<38);
  if(pile){unloadStockpile(pile,m.x);return;}
  const resource=playerResourceAt(m.x,m.y);if(!resource){toast("left click a tree, rock, or diamond deposit");return;}tryPlayerWorkAction();
}

// Player and harvesting workers share this path: harvesting automation creates physical drops, never stored resources.
function hitResource(target,kind,automatic,quiet=false){
  target.hp--;
  target.shake=1;
  spawnResource(kind,target.x+rand(-12,12),target.y+rand(-6,7));
  burst(target.x,target.y-12,kind==="wood"?"#9fb351":kind==="diamond"?"#78d7e5":"#bbb7ae",5);
  if(!automatic&&!quiet)sound(kind==="wood"?350+target.hp*25:kind==="diamond"?760:170+target.hp*15,.045);
  if(target.hp<=0&&kind==="wood"){
    target.stump=1;
    burst(target.x,target.y-10,"#557036",13);
    if(!automatic)toast("tree felled");
  }else if(target.hp<=0){
    target.depleted=1;
    burst(target.x,target.y,kind==="diamond"?"#78d7e5":"#8b8985",11);

  const m=state.mouse;

// Only this function changes phase identity and owns both phase-boundary side effects.
function transitionPhase(){
  const clock=state.clock;
  if(clock.phase==="day"){
    const wave=state.nightWave;
    clock.phase="night";clock.remaining=NIGHT_DURATION;
    wave.activeSide=wave.upcomingSide;wave.activeRecipe=wave.upcomingRecipe;wave.secondarySide=wave.activeRecipe.id==="twoFront"?oppositeMapSide(wave.activeSide):null;wave.lastSides=wave.secondarySide?[wave.activeSide,wave.secondarySide]:[wave.activeSide];wave.remainingSpawns=NIGHT_WAVE_SPAWNS;wave.elapsed=0;wave.nextSpawnAt=NIGHT_WAVE_WINDOW/NIGHT_WAVE_SPAWNS;wave.nightNumber++;
    chooseUpcomingNight();
  }else{
    clock.phase="day";clock.remaining=DAY_DURATION;clock.completedNights++;state.dayEnemyTimer=rand(DAY_ENEMY_SPAWN.min,DAY_ENEMY_SPAWN.max);
    state.nightWave.activeSide=null;state.nightWave.secondarySide=null;state.nightWave.activeRecipe=null;state.nightWave.remainingSpawns=0;
  }
}
function updateClock(dt){
  const clock=state.clock;

  const target=clock.phase==="night"?NIGHT_OVERLAY_ALPHA:0,step=dt*NIGHT_OVERLAY_ALPHA/LIGHT_FADE_TIME;
  clock.light=target>clock.light?Math.min(target,clock.light+step):Math.max(target,clock.light-step);
}

  if(state.clock.phase!=="day")return;
  state.dayEnemyTimer-=dt;
  if(state.dayEnemyTimer>0)return;
  state.dayEnemyTimer=rand(DAY_ENEMY_SPAWN.min,DAY_ENEMY_SPAWN.max);
  if(state.enemies.length<DAY_ENEMY_CAP)spawnEnemy();
}
function updateNightEnemyWave(dt){
  if(state.clock.phase!=="night")return;
  const wave=state.nightWave,interval=NIGHT_WAVE_WINDOW/NIGHT_WAVE_SPAWNS;
  wave.elapsed+=dt;
  // Scheduled thresholds, rather than random frame rolls, keep the quota stable across frame rates.
  while(wave.remainingSpawns>0&&wave.elapsed>=wave.nextSpawnAt&&state.enemies.length<NIGHT_ENEMY_CAP){
    const spawn=wave.activeRecipe.spawns[NIGHT_WAVE_SPAWNS-wave.remainingSpawns],side=spawn[1]===WAVE_FRONT_SECONDARY?wave.secondarySide:wave.activeSide;
    spawnEnemy(side,spawn[0]);wave.remainingSpawns--;wave.nextSpawnAt+=interval;
  }
}

function updateEnemyStatuses(enemy,dt){

    else{burn.remaining-=dt;burn.tickCooldown-=dt;while(burn.tickCooldown<=0&&burn.remaining>=0){burn.tickCooldown+=burn.interval;if(!damageEnemy(enemy,burn.damage,"#ef6a32",5,burn.source))return false;}if(burn.remaining<=0)enemy.status.burn=null;}

}

function update(dt){

  const x=building.x,y=building.y,p=building.pulse*2,def=BUILDING_TYPES[building.type||state.buildMode||"lumber"],radius=building.complete&&building.type==="tower"?towerRadius(building):def.serviceRadius||def.effectRadius;
  if(building.complete&&radius&&state.mouse.inside&&distance(state.mouse.x,state.mouse.y,x,y)<48){drawZone(x,y,radius);if(building.type==="tower"&&towerVariant(building).tauntRadius)drawZone(x,y,towerVariant(building).tauntRadius,"#d6534f99");}
  if(!building.complete||ghost){
    ctx.globalAlpha=ghost?.55:1;ctx.strokeStyle=ghost&&canPlace(x,y)?"#f3e5b9":ghost?"#a94634":"#ead18d";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(x-28-p,y-27-p,56+p*2,54+p*2);ctx.setLineDash([]);
    rect(x-23,y+9,46,7,building.type==="quarry"?"#777775":"#83603a");rect(x-19,y-3,5,19,"#9a774d");rect(x+14,y-3,5,19,"#9a774d");
    if(!ghost){const cost=buildingCost(building),done=building.delivered.wood+building.delivered.stone,total=cost.wood+cost.stone;rect(x-25,y+23,50,7,"#292119");rect(x-23,y+25,46*done/total,3,"#d4a443");ctx.fillStyle="#292119";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.fillText("w "+building.delivered.wood+"/"+cost.wood+"  s "+building.delivered.stone+"/"+cost.stone,x,y+43);if(building.starved){ctx.fillStyle="#a94634";ctx.textAlign="left";ctx.fillText("! starved",x+29,y+29);}}
    ctx.globalAlpha=1;return;
  }
  ctx.fillStyle="#b99e6288";ctx.beginPath();ctx.ellipse(x,y+22,37,12,0,0,Math.PI*2);ctx.fill();
  if(building.type==="landmine"){
    rect(x-14,y+5,28,8,"#594738");rect(x-10,y,20,7,"#76614d");rect(x-4,y-4,8,5,"#a74434");rect(x-1,y-8,3,5,"#d8a343");
  }else if(building.type==="tar"){
    ctx.fillStyle="#382d27";ctx.beginPath();ctx.ellipse(x,y+7,22,11,0,0,Math.PI*2);ctx.fill();rect(x-13,y+2,8,3,"#554234");rect(x+6,y+7,7,2,"#211c19");
  }else if(building.type==="spikes"){
    const metal=building.hazard.flash>0?"#f1dfb7":"#a9a59e";
    rect(x-18,y+10,36,5,"#65442c");rect(x-14,y-5,4,16,metal);rect(x-2,y-10,4,21,metal);rect(x+10,y-5,4,16,metal);
    rect(x-18,y+7,5,4,"#7c7872");rect(x+13,y+7,5,4,"#7c7872");
  }else if(building.type==="blast"){
    rect(x-17,y-8,34,29,"#7b5031");rect(x-14,y-11,28,7,"#a9703f");rect(x-14,y+2,28,4,"#4a3829");rect(x-4,y-16,8,8,"#292119");
    rect(x+2,y-20,3,7,"#d29a3f");rect(x+5,y-23,3,3,"#efc85e");
    const hover=state.mouse.inside&&blastButtonHit(building,state.mouse.x,state.mouse.y);
    if(hover){rect(x-12,y-39,24,22,"#292119");rect(x-9,y-36,18,16,"#b43e32");ctx.fillStyle="#f4e8c6";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("!",x,y-24);}
  }else if(building.type==="obelisk"){
    rect(x-23,y+18,46,7,"#9b6a38");rect(x-17,y+11,34,8,"#c58b49");
    rect(x-12,y-47,24,59,"#b87a3d");rect(x-8,y-54,16,8,"#dda15b");rect(x-5,y-58,10,5,"#e3ad68");rect(x+8,y-47,5,59,"#76502f");
    rect(x-4,y-34,8,8,"#d7a15d");rect(x-2,y-32,4,4,"#72d4cc");
    rect(x-5,y-18,10,10,"#805832");rect(x-3,y-16,6,6,"#d29a55");rect(x-2,y-1,4,10,"#72d4cc");
    const hover=state.mouse.inside&&upgradeButtonHit(building,state.mouse.x,state.mouse.y);
    if(hover&&!building.activeUpgrade){rect(x-27,y+11,22,22,"#292119");rect(x-24,y+14,16,16,"#b45b48");ctx.fillStyle="#f4e8c6";ctx.font="bold 14px monospace";ctx.textAlign="center";ctx.fillText("↑",x-16,y+27);}
    if(building.activeUpgrade){
      const job=building.activeUpgrade,upgrade=UPGRADES.find(item=>item.id===job.id);
      ctx.fillStyle="#f4e8c6";ctx.font="bold 9px monospace";ctx.textAlign="center";
      ctx.fillText(upgrade.name,x,y-70);ctx.fillText("["+job.delivered.wood+"/"+upgrade.cost.wood+"] wood",x,y-60);ctx.fillText("["+job.delivered.stone+"/"+upgrade.cost.stone+"] stone",x,y-50);
      const target=hoverTarget();
      if(target&&target.kind==="upgrade"&&target.object===building){ctx.strokeStyle="#f5df98";ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.strokeRect(x-34,y-78,68,108);ctx.setLineDash([]);}
    }
  }else if(building.type==="tower"){
    drawTowerVariant(building);drawTowerHealth(building);
  }else if(building.type==="stockpile"){
    rect(x-31,y-18,4,43,"#68472c");rect(x+27,y-18,4,43,"#68472c");rect(x-31,y+21,62,4,"#8f6339");
    const wood=Math.min(12,building.storage.wood),stone=Math.min(12,building.storage.stone),dust=Math.min(4,building.storage.dust),coins=Math.min(3,building.storage.coin),gems=Math.min(3,building.storage.diamond);
    for(let i=0;i<wood;i++){const xx=x-24+(i%3)*8,yy=y+14-Math.floor(i/3)*6;rect(xx,yy,13,5,"#a9703f");rect(xx+10,yy,3,5,"#d09a5b");}
    for(let i=0;i<stone;i++){const xx=x+7+(i%3)*7,yy=y+13-Math.floor(i/3)*7;rect(xx,yy,8,7,"#858582");rect(xx+2,yy-2,6,5,"#b1afaa");}
    for(let i=0;i<dust;i++){const xx=x-5+(i%2)*7,yy=y-2-Math.floor(i/2)*7;rect(xx,yy,6,6,"#a783df");rect(xx+2,yy-2,3,3,"#e2c9ff");}
    for(let i=0;i<coins;i++){rect(x-13+i*4,y-9-i*2,6,6,"#e3b445");}
    for(let i=0;i<gems;i++){rect(x+7+i*4,y-9-i*2,6,7,"#79d9e8");}
    ctx.fillStyle="#292119";ctx.font="bold 8px monospace";ctx.textAlign="center";
    if(building.storage.wood>12)ctx.fillText("x"+building.storage.wood,x-18,y-15);
    if(building.storage.stone>12)ctx.fillText("x"+building.storage.stone,x+18,y-15);
    if(building.storage.dust>4)ctx.fillText("x"+building.storage.dust,x,y-22);
    if(building.storage.coin>3)ctx.fillText("c"+building.storage.coin,x-12,y-25);
    if(building.storage.diamond>3)ctx.fillText("d"+building.storage.diamond,x+13,y-25);
    const target=hoverTarget();if(target&&target.kind==="stockpile"&&target.object===building){ctx.strokeStyle="#f5df98";ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeRect(x-35,y-23,70,52);ctx.setLineDash([]);}
  }else if(building.type==="house"){
    rect(x-27,y-10,54,33,"#b98752");rect(x-31,y-17,62,10,"#8d3d2f");rect(x-24,y-22,48,7,"#ad4c38");rect(x-8,y+3,16,20,"#5e4028");rect(x+10,y-1,10,10,"#52738a");
    const used=sourceWorkerCount(building),full=used>=HOUSE_SLOTS,ratio=full?0:clamp(building.spawnTimer/WORKER_SPAWN_TIME,0,1);rect(x-20,y+26,40,7,"#292119");rect(x-18,y+28,36*(1-ratio),3,full?"#70d8d1":"#d19b49");
    ctx.fillStyle="#f4e8c6";ctx.font="bold 8px monospace";ctx.textAlign="center";ctx.fillText(full?used+"/"+HOUSE_SLOTS:Math.max(0,building.spawnTimer).toFixed(1)+"s",x,y+42);
  }else if(building.type==="quarry"){
    rect(x-27,y-5,54,27,"#777775");rect(x-22,y-13,18,13,"#aaa9a5");rect(x+1,y-17,22,17,"#92918e");rect(x-8,y+5,16,17,"#4f4d49");rect(x+25,y-4,7,26,"#65442c");rect(x+20,y+1,17,4,"#b1814e");
  }else{
    rect(x-25,y-13,50,36,"#a9703f");rect(x-25,y-13,50,5,"#c28b50");rect(x-30,y-21,60,11,"#8d3d2f");rect(x-24,y-25,48,6,"#ad4c38");rect(x-8,y+2,16,21,"#5e4028");rect(x+29,y-4,7,27,"#69462a");rect(x+24,y+2,17,5,"#bf8650");
  }
}
function workerToolKind(worker){
  if(worker.job==="harvest")return worker.jobTarget?.kind;
  if(worker.job==="staff")return BUILDING_TYPES[worker.jobTarget?.type]?.resource;
  if(worker.job==="build")return "build";
  return null;
}
function drawCorpse(corpse){
  const x=Math.round(corpse.x+corpse.pose),y=Math.round(corpse.y+corpse.pose*.35),flip=corpse.flip;
  ctx.save();ctx.globalAlpha=.62;ctx.translate(x,y);ctx.scale(flip,1);
  rect(-14,-3,22,7,corpse.coat);rect(5,-4,9,8,"#b79568");rect(11,-5,4,3,"#583e2d");rect(-12,4,5,3,"#3d332d");rect(-3,4,6,3,"#3d332d");
  ctx.restore();
}
function drawWorker(worker){
  const x=Math.round(worker.x),baseY=Math.round(worker.y),bob=Math.sin(worker.step*8)*1.5,y=Math.round(baseY+bob);
  rect(x-5,y-9,10,11,workerCoatColor(worker));rect(x-4,y-17,8,8,"#d7b586");rect(x-5,y-18,10,3,"#6f4930");
  rect(x-5,y+2,4,6,"#49392d");rect(x+2,y+2,4,6,"#49392d");
  const tool=workerToolKind(worker),swing=(worker.combatTarget&&worker.attackCooldown>WORKER_ATTACK_RATE-.2)||(tool&&worker.hitCooldown>WORKER_HIT_COOLDOWN-.2);
  if(worker.job==="haul"){
    const load=workerLoad(worker),col=worker.carried.diamond?"#79d9e8":worker.carried.coin?"#e3b445":worker.carried.dust?"#a783df":worker.carried.stone?"#aaa9a5":"#bd8047";if(load){rect(x-10,y-10,6,13,"#8f673d");rect(x-9,y-7,3,3,col);}
  }else{
    ctx.save();ctx.translate(x+6,y-7);ctx.rotate(swing?-.8:.25);rect(0,-1,13,2,"#65442c");
    if(worker.job==="guard"){rect(11,-7,3,14,"#d8d4c9");rect(8,-2,8,3,"#8b643e");}
    else if(tool==="stone"||tool==="diamond"){rect(9,-5,9,4,"#aaa9a5");rect(13,-3,3,7,"#858582");}
    else if(tool==="build"){rect(9,-5,9,5,"#aaa9a5");rect(12,-1,3,5,"#858582");}
    else{rect(10,-5,5,8,"#b9b7b0");}
    ctx.restore();
  }
  if(worker.job==="build"&&workerLoad(worker)){const col=worker.carried.stone?"#aaa9a5":"#bd8047";rect(x-10,y-9,5,11,"#8f673d");rect(x-9,y-6,3,3,col);}
  if(worker.combatTarget&&worker.attackCooldown>WORKER_ATTACK_RATE-.2){ctx.strokeStyle="#f3dfa3";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+5,y-7);ctx.lineTo(worker.combatTarget.x,worker.combatTarget.y);ctx.stroke();}
  if(worker.hp<WORKER_HP){rect(x-12,y-23,24,4,"#292119");rect(x-11,y-22,22*worker.hp/WORKER_HP,2,"#73a04c");}
}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life*3,0,1);if(p.resource){if(p.kind==="wood")rect(p.x-5,p.y-2,10,5,p.col);else if(p.kind==="dust")rect(p.x-3,p.y-3,6,6,p.col);else rect(p.x-4,p.y-4,8,8,p.col);}else rect(p.x,p.y,3,3,p.col);}ctx.globalAlpha=1;}
function drawFog(){
  for(let y=0;y<FOG_H;y++)for(let x=0;x<FOG_W;x++){
    if(!state.fog[fogIndex(x,y)])continue;
    rect(x*FOG_TS,y*FOG_TS,FOG_TS,FOG_TS,"#292738");
    const n=(x*11+y*17)%19;rect(x*FOG_TS+5+n,y*FOG_TS+7+(n*3)%18,3,3,"#37344a");
  }
}
function drawWarningEdge(side,alpha){
  const thickness=18;ctx.fillStyle="rgba(202,72,48,"+alpha+")";
  if(side===MAP_SIDE.NORTH)ctx.fillRect(0,0,VIEW_W,thickness);
  else if(side===MAP_SIDE.SOUTH)ctx.fillRect(0,VIEW_H-thickness,VIEW_W,thickness);
  else if(side===MAP_SIDE.WEST)ctx.fillRect(0,0,thickness,VIEW_H);
  else ctx.fillRect(VIEW_W-thickness,0,thickness,VIEW_H);
}
function drawNightTelegraph(){
  const clock=state.clock,wave=state.nightWave,side=wave.upcomingSide,recipe=wave.upcomingRecipe;
  if(clock.phase!=="day"||clock.remaining>NIGHT_TELEGRAPH_TIME||!side||!recipe)return;
  const alpha=.42+Math.sin(clock.remaining*5)*.14,secondary=recipe.id==="twoFront"?oppositeMapSide(side):null;
  drawWarningEdge(side,alpha);if(secondary)drawWarningEdge(secondary,alpha);
}
function drawHands(){
  const kinds=[];for(const kind of RESOURCE_KINDS)for(let i=0;i<state.carried[kind];i++)kinds.push(kind);
  if(!state.mouse.inside||!kinds.length)return;
  const shown=Math.min(kinds.length,7);
  for(let i=0;i<shown;i++){const a=-Math.PI*.85+i/(Math.max(1,shown-1))*Math.PI*.7,r=19+(i%2)*5;ctx.save();ctx.translate(state.mouse.x+Math.cos(a)*r,state.mouse.y+Math.sin(a)*r);ctx.rotate(a+.6);if(kinds[i]==="wood"){rect(-6,-3,12,6,"#b67b43");rect(3,-3,3,6,"#e0a35d");}else if(kinds[i]==="dust"){rect(-5,-5,10,10,"#684e91");rect(-3,-7,7,9,"#b18be5");}else if(kinds[i]==="coin"){rect(-5,-6,10,11,"#e3b445");rect(-2,-5,4,7,"#ffe18a");}else if(kinds[i]==="diamond"){rect(-5,-6,10,11,"#79d9e8");rect(-2,-8,5,8,"#d0f9fb");}else{rect(-5,-5,10,10,"#888784");rect(-3,-6,7,7,"#bbb9b3");}ctx.restore();}
}
function drawInteractionPreviews(){
  if(state.mouse.inside&&distance(state.mouse.x,state.mouse.y,BASE.x,BASE.y)<BASE.r+16)drawZone(BASE.x,BASE.y,BASE_ZONE);
  for(const building of buildings){
    const def=BUILDING_TYPES[building.type],radius=building.complete&&building.type==="tower"?towerRadius(building):def.serviceRadius||def.effectRadius;
    if(building.complete&&radius&&state.mouse.inside&&distance(state.mouse.x,state.mouse.y,building.x,building.y)<48){drawZone(building.x,building.y,radius);if(building.type==="tower"&&towerVariant(building).tauntRadius)drawZone(building.x,building.y,towerVariant(building).tauntRadius,"#d6534f99");}
  }
  if(heldWorker()){drawZone(BASE.x,BASE.y,BASE_ZONE,"#d8c47c66");for(const storage of buildings)if(storage.complete&&storage.type==="stockpile")drawZone(storage.x,storage.y,storageServiceRadius(storage),"#d8c47c66");}
  if(state.buildMode&&state.mouse.inside)drawBuilding({type:state.buildMode,x:state.mouse.x,y:state.mouse.y,complete:false,pulse:0},true);
  if(!state.heldObject||!state.mouse.inside)return;
  const worker=heldWorker();
  if(worker){
    drawWorker({...worker,x:state.mouse.x,y:state.mouse.y});
    // Preview consumes the same assignment result that release will commit.
    const assignment=workerAssignmentAt(worker,state.mouse.x,state.mouse.y);
    if(assignment)drawZone(assignment.zoneX,assignment.zoneY,assignment.zoneRadius,"#f5df98");else drawZone(state.mouse.x,state.mouse.y,WORKER_LEASH,"#b84b3c");
  }else{const held={...heldBuilding(),x:state.mouse.x,y:state.mouse.y};drawBuilding(held);ctx.strokeStyle=canPlace(state.mouse.x,state.mouse.y)?"#f5df98":"#b84b3c";ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeRect(state.mouse.x-32,state.mouse.y-48,64,88);ctx.setLineDash([]);}
}
function draw(){
  const camera=state.camera;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#1d1c29";ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.save();
  // Camera transform owns zoom; pointerPosition() applies its exact inverse for interaction.
  ctx.translate(VIEW_W/2,VIEW_H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
  drawGround();
  const sorted=[...trees].sort((a,b)=>a.y-b.y);
  for(const rock of rocks)drawRock(rock);
  for(const diamond of diamonds)drawDiamondNode(diamond);
  for(const tree of sorted)drawTree(tree);
  for(const corpse of workerCorpses)drawCorpse(corpse);
  for(const resource of resourceDrops)drawResource(resource);
  for(const enemy of state.enemies)drawEnemy(enemy);
  drawBase();drawKing();
  for(const building of buildings)drawBuilding(building);
  for(const worker of state.workers)drawWorker(worker);
  drawParticles();drawFog();
  ctx.restore();
  // Lighting is screen-space and precedes interaction/HUD layers so feedback stays readable at night.
  if(state.clock.light>0){ctx.fillStyle="rgba(12,28,67,"+state.clock.light+")";ctx.fillRect(0,0,VIEW_W,VIEW_H);}
  drawNightTelegraph();
  ctx.save();ctx.translate(VIEW_W/2,VIEW_H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
  drawInteractionPreviews();drawHands();ctx.restore();
}

syncBuildHud();syncPhaseHud();syncDebugUiAvailability();setBuildDockCategory(null);
let previous=performance.now();
function frame(now){const dt=Math.min(.033,(now-previous)/1000);previous=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
toast("click the dark fog to explore");
</script>
